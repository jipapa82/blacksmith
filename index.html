<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대장간 — 전투 프로토타입 v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">

<header>
  <h1>대장간 <em>/</em> 전투 프로토타입</h1>
  <span class="tagline">v4 — 버티고, 두드리고, 다시 나간다</span>
  <div class="head-actions">
    <div class="seg" id="speedSeg">
      <button data-sp="0.5">0.5배</button>
      <button data-sp="1" class="on">1배</button>
      <button data-sp="2">2배</button>
    </div>
    <button id="startBtn" class="primary">출정</button>
  </div>
</header>

<main>
  <div>
    <div class="panel" style="margin-bottom:14px">
      <div class="panel-hd">편성</div>
      <div class="panel-bd">
        <div id="mercList"></div>
        <button class="swap-btn" id="swapBtn">앞줄 · 뒷줄 바꾸기</button>
        <p class="note">용병 능력치는 0. 모든 수치는 장비에서 온다.<br>
          강화도 용병이 아니라 장비에 새겨진다.</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-hd">밸런스 수치</div>
      <div class="panel-bd">
        <div class="bal-grid" id="balGrid"></div>
        <div class="slider-row">
          <label>적 강도 <b id="foeMulLbl">1.00</b></label>
          <input type="range" id="foeMul" min="0.4" max="2.2" step="0.05" value="1">
        </div>
        <div class="slider-row">
          <label>몰려오는 양 <b id="rateLbl">1.00</b></label>
          <input type="range" id="rate" min="0.4" max="2.5" step="0.05" value="1">
        </div>
        <div class="slider-row">
          <label>웨이브 길이 <b id="durLbl">22초</b></label>
          <input type="range" id="dur" min="10" max="45" step="2" value="22">
        </div>
        <p class="note">바꾸면 다음 출정부터 적용.</p>
      </div>
    </div>
  </div>

  <div class="panel arena" id="arena">
    <div class="hud">
      <div class="wave-num" id="waveNum">0</div>
      <div>
        <div class="hud-meta">웨이브 / 16</div>
        <div class="hud-title" id="waveTitle">출정 대기</div>
      </div>
      <div class="hud-right">
        <div class="hud-stat g">골드 <b id="goldTxt" style="color:var(--gold)">0</b></div>
        <div class="hud-stat m">재료 <b id="matTxt" style="color:var(--quench)">0</b></div>
        <div class="hud-stat">남은 적 <b id="aliveTxt" style="color:var(--blood)">0</b></div>
        <div class="hud-stat">처치 <b id="killTxt">0</b></div>
        <div class="hud-stat" id="statusTxt">준비</div>
      </div>
    </div>
    <div class="timebar"><i id="timeFill"></i></div>
    <div class="canvas-wrap"><canvas id="cv" width="880" height="400"></canvas></div>
    <div class="crew" id="crew"></div>
    <div class="legend">
      <span class="lg"><i class="dot" style="background:#C4574F"></i>돌격병 — 앞줄에 막힌다</span>
      <span class="lg"><i class="dot" style="background:#E8963C"></i>돌파병 — 뒤로 파고든다</span>
      <span class="lg"><i class="dot" style="background:#9B8ACB"></i>궁수 — 멀리서 뒷줄을 쏜다</span>
      <span class="lg"><i class="dot" style="background:#8B4A44"></i>대장 — 느리고 두껍다</span>
    </div>
  </div>
</main>
</div>

<!-- ES 모듈이 아니라 일반 스크립트 나열이다. file://로 바로 열어도 돌아가게 하기 위함.
     전역 공유 상태는 state.js 한 곳에만 둔다. 로드 순서: 데이터 → 상태 → 전투 → 렌더 → UI → 메인 -->
<script src="data/equipment.js"></script>
<script src="data/foes.js"></script>
<script src="data/upgrades.js"></script>
<script src="data/waves.js"></script>
<script src="state.js"></script>
<script src="combat/units.js"></script>
<script src="combat/damage.js"></script>
<script src="combat/actions.js"></script>
<script src="combat/wave.js"></script>
<script src="render/fx.js"></script>
<script src="render/draw.js"></script>
<script src="ui/loadout.js"></script>
<script src="ui/balance.js"></script>
<script src="ui/crew.js"></script>
<script src="ui/forge.js"></script>
<script src="main.js"></script>
</body>
</html>
